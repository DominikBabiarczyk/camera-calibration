<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1250" viewBox="0 0 900 1250">
<rect width="900" height="1250" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:bold}.sub{font-size:19px;fill:#526070}.label{font-size:22px;font-weight:bold}.small{font-size:18px}.dim{font-size:18px;fill:#526070}.box{stroke:#234;stroke-width:2.5;rx:16}.arrow{stroke:#526070;stroke-width:3;fill:none;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#526070"/></marker></defs>
<text x="450" y="52" text-anchor="middle" class="title">Corner GRU Sequence Calibration Network</text><text x="450" y="84" text-anchor="middle" class="sub">Schemat przepływu danych od góry do dołu</text>
<rect x="250" y="125" width="400" height="125" fill="#eaf2ff" class="box"/><text x="450" y="165" text-anchor="middle" class="label">Wejście</text><text x="450" y="200" text-anchor="middle" class="small">X ∈ (B, T, 81, 4)</text><text x="450" y="230" text-anchor="middle" class="dim">narożniki: [x, y, x̂, ŷ]</text><path d="M450 250 V300" class="arrow"/>
<rect x="150" y="300" width="600" height="260" fill="#e8f7ef" class="box"/><text x="450" y="345" text-anchor="middle" class="label">Frame encoder</text><text x="450" y="390" text-anchor="middle" class="small">Flatten: 81 × 4 → 324</text><text x="450" y="428" text-anchor="middle" class="small">Linear 324 → 96 + ReLU</text><text x="450" y="466" text-anchor="middle" class="small">LayerNorm(96)</text><text x="450" y="504" text-anchor="middle" class="small">Linear 96 → 96 + ReLU</text><text x="450" y="540" text-anchor="middle" class="dim">H: (B, T, 96)</text><path d="M450 560 V610" class="arrow"/>
<rect x="150" y="610" width="600" height="230" fill="#fff4df" class="box"/><text x="450" y="655" text-anchor="middle" class="label">Temporal encoder: GRU</text><text x="450" y="705" text-anchor="middle" class="small">input_size = 96</text><text x="450" y="740" text-anchor="middle" class="small">hidden_size = 128</text><text x="450" y="775" text-anchor="middle" class="small">num_layers = 1</text><text x="450" y="810" text-anchor="middle" class="small">bramki: update z, reset r</text><path d="M450 840 V890" class="arrow"/>
<rect x="150" y="890" width="600" height="205" fill="#f5edff" class="box"/><text x="450" y="935" text-anchor="middle" class="label">Regressor</text><text x="450" y="980" text-anchor="middle" class="small">Linear 128 → 96 → ReLU</text><text x="450" y="1015" text-anchor="middle" class="small">Dropout 0.1</text><text x="450" y="1050" text-anchor="middle" class="small">Linear 96 → 8</text><text x="450" y="1080" text-anchor="middle" class="dim">y: (B, 8)</text><path d="M450 1095 V1145" class="arrow"/>
<rect x="150" y="1145" width="600" height="80" fill="#eaf2ff" class="box"/><text x="450" y="1178" text-anchor="middle" class="label">Wyjście: [fx, fy, cx, cy, k1, k2, k3, k4]</text><text x="450" y="1208" text-anchor="middle" class="dim">parametry fisheye</text></svg>
